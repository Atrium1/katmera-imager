name: Draft GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME}"
          gh release create "$VER" \
            --draft \
            --title "Katmera Imager ${VER}" \
            --notes "$(cat <<EOF
          ## Katmera Imager ${VER}

          Based on Raspberry Pi Imager **v2.0.11.1** (Apache-2.0). See \`katmera/NOTICE\`.

          ### Phase 1 foundation
          - microSD flashing for Nexus Hub + OctaPower 3566 AI / Omnicore 1126B
          - Catalog stubs until BSP images publish — test with **Use custom**
          - Private unlock / signed URLs: M3 (not in this build)
          - Artifacts may be **unsigned** until M6

          See \`katmera/docs/BUILD.md\` and \`katmera/docs/FOLLOWUPS.md\`.
          EOF
          )"
