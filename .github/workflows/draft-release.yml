name: Draft GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME}"
          gh release create "$VER" \
            --draft \
            --title "Katmera Imager ${VER}" \
            --notes "$(cat <<EOF
          ## Katmera Imager ${VER}

          Based on Raspberry Pi Imager **v2.0.11.1** (Apache-2.0). See \`katmera/NOTICE\`.

          ### Contents
          - microSD flashing for Nexus Hub + OctaPower 3566 AI / Omnicore 1126B
          - Default catalog: \`https://downloads.katmera.com/imager/os_list_v4.json\`
          - M3 download token (App Options) when unlock API is live
          - Attach **signed** installers when M6 secrets are configured; otherwise label artifacts **unsigned**

          ### Expected artifacts (M6)
          | Platform | File |
          |----------|------|
          | Windows | \`Katmera-Imager-Setup-${VER#v}.exe\` (Authenticode) |
          | macOS | \`Katmera-Imager-${VER#v}.dmg\` (Developer ID + notarized) |
          | Linux | \`katmera-imager_${VER#v}_amd64.deb\` |
          | Checksums | \`SHA256SUMS\` |

          ### Build flags (signed builders)
          \`\`\`
          Windows: -DENABLE_INNO_INSTALLER=ON -DIMAGER_SIGNED_APP=ON -DENABLE_TELEMETRY=OFF
          macOS:   -DIMAGER_SIGNED_APP=ON -DIMAGER_SIGNING_IDENTITY=… -DIMAGER_NOTARIZE_APP=ON -DENABLE_TELEMETRY=OFF
          Linux:   debian/ pipeline
          \`\`\`

          Secrets (when available): \`WINDOWS_CERT_PFX\`, \`WINDOWS_CERT_PASSWORD\`,
          Apple Developer ID / notary profile. See \`katmera/docs/RELEASE.md\`.

          Lab unsigned builds: \`katmera/docs/BUILD.md\`.
          EOF
          )"
