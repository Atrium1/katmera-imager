name: Draft GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME}"
          gh release create "$VER" \
            --draft \
            --title "Katmera Imager ${VER}" \
            --notes "$(cat <<EOF
          ## Katmera Imager ${VER}

          Based on Raspberry Pi Imager **v2.0.11.1** (Apache-2.0). See \`katmera/NOTICE\`.

          ### Phase 1 scope
          - microSD flashing for Nexus Hub + OctaPower 3566 AI / Omnicore 1126B
          - Private images via download token → signed CDN URLs

          ### Artifacts
          Attach platform installers built per \`katmera/docs/RELEASE.md\`:
          - \`Katmera-Imager-Setup-*.exe\`
          - \`Katmera-Imager-*.dmg\`
          - \`katmera-imager_*_amd64.deb\`

          ### Unlock
          App Options → Download token (see \`katmera/docs/DOWNLOAD_API.md\`).
          EOF
          )"
