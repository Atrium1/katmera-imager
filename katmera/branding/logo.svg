  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- left gear arc (orange) -->
    <path d="M28 40c-10 8-14 20-10 32 4 12 14 20 26 22" stroke="#f86000" stroke-width="10"/>
    <circle cx="22" cy="52" r="4" fill="#f86000" stroke="none"/>
    <circle cx="18" cy="72" r="4" fill="#f86000" stroke="none"/>
    <!-- right gear segments (charcoal) -->
